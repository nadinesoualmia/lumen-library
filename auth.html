<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='10' fill='%2335251E'/%3E%3Cpath d='M12 12h9c2 0 3 1 3 3v20c0-2-1-3-3-3h-9V12z' fill='%23DCC8AD'/%3E%3Cpath d='M36 12h-9c-2 0-3 1-3 3v20c0-2 1-3 3-3h9V12z' fill='%23B88A5A'/%3E%3Cpath d='M24 15v20' stroke='%2335251E' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/app.js"></script>

<style>
  .auth-page-v2{
    background: linear-gradient(135deg, #e5d0b8 0%, #f0dfcc 50%, #fff8ef 100%);
    min-height: calc(100vh - var(--hdr-h));
    padding: 2rem 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-shell{
    width: 100%;
    max-width: 900px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 30px 90px rgba(53,37,30,.18);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    min-height: 580px;
  }

  .auth-left{
    background: linear-gradient(150deg, #35251E 0%, #604735 50%, #75452e 100%);
    color: #fff;
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    grid-column: 1;
    grid-row: 1;
    transition: transform .55s cubic-bezier(.68, -.3, .32, 1.3);
    z-index: 2;
    border-radius: 24px 0 0 24px;
  }

  .auth-shell.mode-signup .auth-left{
    transform: translateX(100%);
    border-radius: 0 24px 24px 0;
  }

  .auth-left::before,
  .auth-left::after{
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(220,200,173,.08);
    pointer-events: none;
  }
  .auth-left::before{
    width: 320px;
    height: 320px;
    top: -140px;
    right: -140px;
    animation: floatCircle 14s ease-in-out infinite;
  }
  .auth-left::after{
    width: 200px;
    height: 200px;
    bottom: -90px;
    left: -70px;
    background: rgba(184,138,90,.12);
    animation: floatCircle 10s ease-in-out infinite reverse;
  }

  @keyframes floatCircle{
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-15px, 15px); }
  }

  .auth-left-content{
    position: relative;
    z-index: 2;
  }

  .auth-shell.mode-signup .auth-left-content{
    animation: fadeInContent .5s ease .25s both;
  }

  @keyframes fadeInContent{
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-left .brand-mark{
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: 2rem;
  }

  .auth-left .brand-mark svg{
    width: 40px;
    height: 40px;
  }

  .auth-left .brand-mark b{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: #DCC8AD;
    letter-spacing: -.01em;
  }

  .auth-left h2{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.9rem;
    font-weight: 600;
    color: #fff;
    margin: 0 0 1rem;
    line-height: 1.15;
  }

  .auth-left p{
    font-size: .88rem;
    opacity: .82;
    line-height: 1.7;
    margin: 0 0 2rem;
    max-width: 280px;
    color: #DCC8AD;
  }

  .auth-left .btn-switch{
    background: #DCC8AD;
    color: #35251E;
    border: 0;
    padding: .75rem 1.8rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: .82rem;
    cursor: pointer;
    transition: transform .2s, background .2s;
    align-self: flex-start;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .auth-left .btn-switch:hover{
    background: #fff;
    transform: translateY(-1px);
  }

  .auth-right{
    padding: 2.5rem 2.8rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
    grid-column: 2;
    grid-row: 1;
    background: #fff;
    border-radius: 0 24px 24px 0;
    transition: border-radius .55s ease;
  }

  .auth-shell.mode-signup .auth-right{
    grid-column: 1;
    border-radius: 24px 0 0 24px;
  }

  .auth-form-wrapper{
    position: relative;
    min-height: 420px;
  }

  .auth-form{
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
    will-change: transform, opacity;
  }

  .auth-form.exit-left{
    transform: translateX(-60px);
    opacity: 0;
  }

  .auth-form.exit-right{
    transform: translateX(60px);
    opacity: 0;
  }

  .auth-form.enter-left{
    transform: translateX(-60px);
    opacity: 0;
  }

  .auth-form.enter-right{
    transform: translateX(60px);
    opacity: 0;
  }

  .auth-form.active{
    position: relative;
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .auth-form h1{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.85rem;
    font-weight: 600;
    color: #35251E;
    margin: 0 0 .3rem;
    line-height: 1.15;
  }

  .auth-form > .muted{
    color: #80604b;
    font-size: .85rem;
    margin: 0 0 1.4rem;
  }

  .auth-form label{
    display: block;
    font-size: .76rem;
    font-weight: 600;
    color: #604735;
    margin: .7rem 0 .3rem;
    letter-spacing: .02em;
  }

  .auth-form input[type="text"],
  .auth-form input[type="email"],
  .auth-form input[type="tel"],
  .auth-form input[type="password"]{
    width: 100%;
    padding: .6rem .85rem;
    border: 1.5px solid #d8bda4;
    border-radius: 9px;
    background: #fdfaf6;
    font-size: .88rem;
    color: #3b261b;
    transition: border-color .2s, box-shadow .2s, background .2s;
    font-family: inherit;
  }

  .auth-form input:focus{
    outline: none;
    border-color: #B88A5A;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(184,138,90,.15);
  }

  .role-picker{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: .5rem;
    margin-bottom: .4rem;
  }

  .role-option{
    cursor: pointer;
    padding: .55rem .4rem;
    border: 1.5px solid #d8bda4;
    border-radius: 9px;
    background: #fff;
    text-align: center;
    font-size: .72rem;
    font-weight: 600;
    color: #80604b;
    transition: all .2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .25rem;
    line-height: 1.1;
  }

  .role-option input{ display: none; }

  .role-option svg{
    width: 18px; height: 18px;
    stroke: currentColor; fill: none; stroke-width: 1.8;
    opacity: .75;
  }

  .role-option:hover{
    background: #f8eee3;
    border-color: #B88A5A;
    color: #75452e;
  }

  .role-option:has(input:checked){
    background: #B88A5A;
    border-color: #B88A5A;
    color: #fff;
    box-shadow: 0 3px 10px rgba(184,138,90,.35);
  }

  .role-option:has(input:checked) svg{ opacity: 1; }

  .auth-form button[type="submit"]{
    width: 100%;
    padding: .7rem;
    margin-top: 1.1rem;
    background: linear-gradient(135deg, #B88A5A, #75452e);
    color: #fff;
    border: 0;
    border-radius: 9px;
    font-weight: 700;
    font-size: .85rem;
    letter-spacing: .03em;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 4px 15px rgba(117,69,46,.3);
    font-family: inherit;
  }

  .auth-form button[type="submit"]:hover{
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(117,69,46,.4);
  }

  .auth-form .form-err{
    color: #C47F65;
    font-size: .76rem;
    min-height: 1.1em;
    margin: .4rem 0 0;
  }

  .auth-form .auth-alt{
    margin-top: 1rem;
    text-align: center;
    font-size: .78rem;
    color: #80604b;
  }

  .auth-form .auth-alt a{
    color: #75452e;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    transition: color .15s;
  }

  .auth-form .auth-alt a:hover{ color: #B88A5A; }

  .auth-form .pw-wrap{ position: relative; }
  .auth-form .pw-wrap input{ padding-right: 2.6rem; }

  .auth-form .pw-wrap .eye{
    position: absolute;
    right: .5rem; top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: transparent; border: 0;
    border-radius: 7px; color: #604735;
    cursor: pointer;
  }

  .auth-form .pw-wrap .eye:hover{ background: #f0e0ce; }

  .auth-form .row-2{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .7rem;
  }

  @media (max-width: 820px){
    .auth-shell{
      grid-template-columns: 1fr;
      max-width: 460px;
      min-height: auto;
    }

    .auth-left{
      grid-column: 1;
      grid-row: 1;
      transform: none !important;
      border-radius: 24px 24px 0 0;
    }

    .auth-right{
      grid-column: 1;
      grid-row: 2;
      border-radius: 0 0 24px 24px;
    }

    .auth-shell.mode-signup .auth-left{
      transform: none !important;
      border-radius: 24px 24px 0 0;
    }

    .auth-shell.mode-signup .auth-right{
      grid-column: 1;
      border-radius: 0 0 24px 24px;
    }

    .auth-left{ padding: 2rem 1.8rem; }
    .auth-left h2{ font-size: 1.5rem; }
    .auth-left p{ font-size: .82rem; margin-bottom: 1.2rem; }
    .auth-right{ padding: 2rem 1.8rem; }
    .auth-form-wrapper{ min-height: 480px; }
  }

  @media (max-width: 480px){
    .auth-page-v2{ padding: 1rem .5rem; }
    .auth-right{ padding: 1.5rem 1.2rem; }
    .auth-form h1{ font-size: 1.55rem; }
    .auth-form .row-2{ grid-template-columns: 1fr; }
    .auth-form-wrapper{ min-height: 560px; }
  }
</style>
</head>
<body>
<div id="site-header"></div>

<main class="auth-page-v2">
  <div class="auth-shell" id="authShell">

    <div class="auth-left">
      <div class="auth-left-content">
        <div class="brand-mark">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="44" height="44" rx="10" fill="#DCC8AD"/>
            <path d="M12 12h9c2 0 3 1 3 3v20c0-2-1-3-3-3h-9V12z" fill="#35251E"/>
            <path d="M36 12h-9c-2 0-3 1-3 3v20c0-2 1-3 3-3h9V12z" fill="#B88A5A"/>
            <path d="M24 15v20" stroke="#35251E" stroke-width="1.2"/>
          </svg>
          <b>Lumen Library</b>
        </div>

        <h2 id="leftTitle">Welcome back</h2>
        <p id="leftText">Sign in to borrow books, track your loans and discover new reads.</p>
        <button type="button" class="btn-switch" id="switchBtn">Create an account</button>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrapper">

        <form class="auth-form active" id="signInForm" novalidate>
          <h1>Sign in</h1>
          <p class="muted">Sign in to manage your loans.</p>

          <label>Sign in as</label>
          <div class="role-picker">
            <label class="role-option">
              <input type="radio" name="signin-role" value="reader" checked>
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
              </svg>
              Reader
            </label>
            <label class="role-option">
              <input type="radio" name="signin-role" value="librarian">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 4v16"/>
              </svg>
              Librarian
            </label>
            <label class="role-option">
              <input type="radio" name="signin-role" value="admin">
              <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              Admin
            </label>
          </div>

          <label for="si-email">Email or phone number</label>
          <input id="si-email" type="text" placeholder="you@example.com or 0555123456" required>

          <label for="si-pw">Password</label>
          <div class="pw-wrap">
            <input id="si-pw" type="password" placeholder="••••••••" required>
          </div>

          <p class="form-err" id="si-err" role="alert"></p>
          <button type="submit">Sign in →</button>

          <p class="auth-alt">No account yet? <a id="switchToSignup">Sign up</a></p>
        </form>

        <form class="auth-form" id="signUpForm" novalidate>
          <h1>Create account</h1>
          <p class="muted">Join the library and borrow online.</p>

          <div class="row-2">
            <div>
              <label for="su-name">Full name</label>
              <input id="su-name" type="text" placeholder="Your name" required>
            </div>
            <div>
              <label for="su-phone">Phone number</label>
              <input id="su-phone" type="tel" placeholder="0555123456" required>
            </div>
          </div>

          <label for="su-email">Email address</label>
          <input id="su-email" type="email" placeholder="you@example.com" required>

          <div class="row-2">
            <div>
              <label for="su-pw">Password</label>
              <div class="pw-wrap">
                <input id="su-pw" type="password" placeholder="Min. 8 chars" required>
              </div>
            </div>
            <div>
              <label for="su-pw2">Confirm password</label>
              <div class="pw-wrap">
                <input id="su-pw2" type="password" placeholder="Repeat password" required>
              </div>
            </div>
          </div>

          <p class="form-err" id="su-err" role="alert"></p>
          <button type="submit">Create account →</button>

          <p class="auth-alt">Already registered? <a id="switchToSignin">Sign in</a></p>
        </form>

      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
document.addEventListener("DOMContentLoaded", async function(){
  await window.appReady;

  const authShell = document.getElementById("authShell");
  const signInForm = document.getElementById("signInForm");
  const signUpForm = document.getElementById("signUpForm");
  const leftTitle = document.getElementById("leftTitle");
  const leftText = document.getElementById("leftText");
  const switchBtn = document.getElementById("switchBtn");
  const switchToSignup = document.getElementById("switchToSignup");
  const switchToSignin = document.getElementById("switchToSignin");

  let currentMode = "signin";
  let isAnimating = false;

  /* ---------- Apply mode from URL on first load ---------- */
  function applyModeFromURL(){
    const urlMode = new URLSearchParams(location.search).get("mode");
    if (urlMode === "signup"){
      authShell.classList.add("mode-signup");
      signInForm.classList.remove("active");
      signUpForm.classList.add("active");
      leftTitle.textContent = "Hello, reader.";
      leftText.textContent = "Create your reader account and start borrowing from our collection today.";
      switchBtn.textContent = "Sign in instead";
      currentMode = "signup";
    }
  }
  applyModeFromURL();

  /* ---------- Animated mode switch ---------- */
  function setMode(mode){
    if (mode === currentMode || isAnimating) return;
    isAnimating = true;

    const goingToSignup = (mode === "signup");
    const activeForm = goingToSignup ? signInForm : signUpForm;
    const nextForm   = goingToSignup ? signUpForm : signInForm;

    if (goingToSignup){
      authShell.classList.add("mode-signup");
    } else {
      authShell.classList.remove("mode-signup");
    }

    activeForm.classList.remove("active", "enter-left", "enter-right");
    activeForm.classList.add(goingToSignup ? "exit-right" : "exit-left");

    nextForm.classList.remove("active", "exit-left", "exit-right", "enter-left", "enter-right");
    nextForm.classList.add(goingToSignup ? "enter-right" : "enter-left");

    void nextForm.offsetWidth;

    nextForm.classList.remove("enter-left", "enter-right");
    nextForm.classList.add("active");

    setTimeout(() => {
      activeForm.classList.remove("exit-left", "exit-right");
      isAnimating = false;
    }, 550);

    if (mode === "signin"){
      leftTitle.textContent = "Welcome back";
      leftText.textContent = "Sign in to borrow books, track your loans and discover new reads.";
      switchBtn.textContent = "Create an account";
    } else {
      leftTitle.textContent = "Hello, reader.";
      leftText.textContent = "Create your reader account and start borrowing from our collection today.";
      switchBtn.textContent = "Sign in instead";
    }

    /* Keep URL in sync (no reload) */
    const newQuery = mode === "signup" ? "?mode=signup" : "?mode=signin";
    history.replaceState(null, "", newQuery);

    currentMode = mode;
  }

  switchBtn.addEventListener("click", () => {
    setMode(currentMode === "signin" ? "signup" : "signin");
  });
  switchToSignup.addEventListener("click", () => setMode("signup"));
  switchToSignin.addEventListener("click", () => setMode("signin"));

  /* ---------- Intercept header links so they animate instead of reloading ---------- */
  document.addEventListener("click", function(e){
    const link = e.target.closest('.hdr-auth a[href^="auth.html"]');
    if (!link) return;
    const target = link.getAttribute("href"); // auth.html?mode=signin or ?mode=signup
    const wantSignup = target.indexOf("mode=signup") !== -1;
    const wantMode = wantSignup ? "signup" : "signin";
    if (wantMode === currentMode) {
      e.preventDefault(); // already there, just stop the page reload
      return;
    }
    e.preventDefault();
    setMode(wantMode);
  });

  /* ---------- Sign in ---------- */
  signInForm.addEventListener("submit", async function(e){
    e.preventDefault();
    const email = document.getElementById("si-email").value.trim();
    const pw = document.getElementById("si-pw").value;
    const err = document.getElementById("si-err");
    const role = document.querySelector('input[name="signin-role"]:checked').value;

    if (!email){ err.textContent = "Enter your email or phone number."; return; }
    if (pw.length < 8){ err.textContent = "Password must be at least 8 characters."; return; }
    err.textContent = "";

    const r = await signIn(email, pw, role);
    if (!r.ok){ err.textContent = r.error; return; }

    showToast("Signed in as " + role + ".");
    const next = new URLSearchParams(location.search).get("next");
    setTimeout(function(){
      const target = next || (
        role === "admin"     ? "admin.html" :
        role === "librarian" ? "librarian.html" :
                               "dashboard.html"
      );
      location.href = target;
    }, 500);
  });

  /* ---------- Sign up ---------- */
  signUpForm.addEventListener("submit", async function(e){
    e.preventDefault();
    const name = document.getElementById("su-name").value.trim();
    const email = document.getElementById("su-email").value.trim();
    const phone = document.getElementById("su-phone").value.trim();
    const pw = document.getElementById("su-pw").value;
    const pw2 = document.getElementById("su-pw2").value;
    const err = document.getElementById("su-err");

    if (!name){ err.textContent = "Enter your full name."; return; }
    if (!/^\S+@\S+\.\S+$/.test(email)){ err.textContent = "Enter a valid email address."; return; }
    if (!phone || phone.length < 6){ err.textContent = "Enter a valid phone number."; return; }
    if (pw.length < 8){ err.textContent = "Password must be at least 8 characters."; return; }
    if (pw !== pw2){ err.textContent = "Passwords do not match."; return; }
    err.textContent = "";

    const r = await signUp(name, email, phone, pw, pw2);
    if (!r.ok){ err.textContent = r.error; return; }

    showToast("Account created.");
    setTimeout(function(){ location.href = "dashboard.html"; }, 600);
  });
});
</script>
</body>
</html>
